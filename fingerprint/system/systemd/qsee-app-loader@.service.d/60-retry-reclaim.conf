# [elish fingerprint] Recover from transient CMA allocation failures instead of
# requiring a reboot.  /usr/local/bin/qsee-app-loader-retry runs the real
# loader and, on failure, drops page cache + compacts memory and retries with
# backoff (see fingerprint/NOTES.md §2).
#
# NotifyAccess=all: the real loader (child) sends READY=1; the wrapper is the
# service's main process, so systemd must accept the notification from any
# process in the unit.
# TimeoutStartSec=0: under memory pressure the wrapper may legitimately retry
# for minutes before the TA loads; do not abort the unit in the meantime.
[Service]
ExecStart=
ExecStart=/usr/local/bin/qsee-app-loader-retry %i
NotifyAccess=all
TimeoutStartSec=0
