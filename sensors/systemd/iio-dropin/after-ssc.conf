[Unit]
# 2026-11-12 加速改造：去掉 After=multi-user.target，让 iio 可以随传感器栈提前启动
# （iio 已打 stayalive/热插补丁；启动脚本会轮询数据，不再盲重启）。
#After=multi-user.target

[Service]
ExecStartPre=/bin/sleep 2
Restart=on-failure
RestartSec=5
# iio 在 libssc 的 registry 等待里可能阻塞 ~30s；限制 stop 时间，避免 systemctl stop
# 卡在 graceful 等待上（并让启动脚本/iio 重启路径确定在 ~3s 内完成）。
TimeoutStopSec=3
